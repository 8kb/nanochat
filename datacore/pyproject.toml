[project]
name = "datacore"
version = "0.1.0"
description = "A standalone data subsystem: prepare a pretokenized, packed, multipart dataset and read it back as flexible-batch-size, DDP-shardable, exactly-resumable batches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# datacore.reader's batch iterator hands out torch tensors; the write path (manager.prepare,
# writer, packing, sources) never touches torch at all -- see datacore/docs/architecture.md.
torch = [
    "torch>=2.9.1",
]
# datacore.sources.ParquetDirectorySource, for a corpus stored as parquet shards.
parquet = [
    "pyarrow>=21.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datacore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# This file describes datacore/ as a standalone package for when it is split into its own repo
# (mirrors modelcore/pyproject.toml -- see docs/roadmap.md's Stage 10, the repo split). It is not
# wired into this repo's own root pyproject.toml/uv workspace -- nanochat installs and imports
# datacore the same way it imports modelcore, by cwd-relative `import datacore`. Nothing about
# `uv sync` at the repo root changes because this file exists.
